
server:
  port: 8083

spring:
  application:
    name: ai-service
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5434/ai_db
    username: admin
    password: ${AI_DB_PASS}

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASS}
  sql:
    init:
      mode: always
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    url: jdbc:postgresql://localhost:5434/ai_db
    user: admin
    password: ${AI_DB_PASS}
  docker:
    compose:
      enabled: false


EXCHANGE_NAME: incident_exchange
INCIDENT_CREATION_QUEUE: incident-creation-queue
INCIDENT_CREATED_BINDING_KEY: incident.created
INCIDENT_EVALUATED_ROUTING_KEY: incident.evaluated