
server:
  port: 8083

spring:
  application:
    name: ai-service
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5434/ai_db
    username: admin
    password: ${AI_DB_PASS}

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  rabbitmq:
    host: localhost
    port: 5671
    username: ${RABBITMQ_AI_SERVICE_USERNAME}
    password: ${RABBITMQ_AI_SERVICE_PASSWORD}
    ssl:
      enabled: true
      trust-store: file:/home/niri/codeRed/pki/ca/codered-truststore.p12
      trust-store-type: PKCS12
      trust-store-password: ${INCIDENT_TLS_TRUSTSTORE_PASSWORD}
      validate-server-certificate: true
      verify-hostname: true
  sql:
    init:
      mode: always
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  docker:
    compose:
      enabled: false
  ai:
    openai:
      api-key: ${GROQ_API_KEY}
      base-url: ${GROQ_BASE_URL}
      chat:
        model: ${GROQ_MODEL}

EXCHANGE_NAME: incident.exchange
CLASSIFICATION_REQUESTED_QUEUE: classification.requested.queue
CLASSIFICATION_REQUESTED_BINDING_KEY: classification.requested
INCIDENT_EVALUATED_ROUTING_KEY: incident.classified

INCIDENT_DLX_EXCHANGE_NAME: incident.dlx
INCIDENT_DLX_QUEUE_NAME: classification.requested.dlq
INCIDENT_DLX_ROUTING_KEY: classification.requested.dead
