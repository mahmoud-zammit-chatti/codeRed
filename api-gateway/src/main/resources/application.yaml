server:
  port: 8080
  compression:
    enabled: true

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      default-filters:
        - name: RequestSize
          args:
            maxSize: 5000000
      routes:
      - id: incident-service
        uri: http://localhost:8081
        predicates:
          - Path=/api/incidents/**
      - id: dispatch-service
        uri: http://localhost:8082
        predicates:
           - Path=/api/dispatch/**

      - id: ai-service
        uri: http://localhost:8083
        predicates:
           - Path=/api/ai/**

      - id: notification-service
        uri: http://localhost:8084
        predicates:
           - Path=/api/notifications/**
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/code-red


management:
  endpoint:
    gateway:
      access: unrestricted
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web.reactive: DEBUG