server:
  port: 8081
spring:
  application:
    name: incident-service
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5435/incident_db
    username: admin
    password: ${INCIDENT_DB_PASS}
  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASS}
  sql:
    init:
      mode: always
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    url: jdbc:postgresql://localhost:5435/incident_db
    user: admin
    password: ${INCIDENT_DB_PASS}
  docker:
    compose:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info




EXCHANGE_NAME: incident.exchange
AI_CLASSIFICATION_QUEUE: incident.classified.queue
INCIDENT_CLASSIFIED_BINDING_KEY: incident.classified
INCIDENT_CREATED_ROUTING_KEY: incident.created