services:

  rabbitmq:
    image: rabbitmq:3-management
    container_name: codered-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - dispatch-service
      - ai-service
      - incident-service
      - notification-service

  incident-db:
    image: postgres:18-alpine
    volumes:
      - incident-db-data:/var/lib/postgresql
    ports:
        - "5435:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d incident_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      - POSTGRES_DB=incident_db
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=${INCIDENT_DB_PASS}

  incident-service:
    build: ./incident-service
    ports:
      - "8081:8081"
    depends_on:
      - incident-db
    environment: # PROD: Inject cleanly here
      - SPRING_DATASOURCE_URL=jdbc:postgresql://incident-db:5432/incident_db # Standard internal port 5432
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=${INCIDENT_DB_PASS}
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASS}
  dispatch-db:
    image: postgres:18-alpine
    volumes:
      - dispatch-db-data:/var/lib/postgresql
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d dispatch_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      - POSTGRES_DB=dispatch_db
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=${DISPATCH_DB_PASS}



  dispatch-service:
    build: ./dispatch-service
    depends_on:
      - dispatch-db
    environment: # PROD: Inject cleanly here
      - SPRING_DATASOURCE_URL=jdbc:postgresql://dispatch-db:5432/dispatch_db # Standard internal port 5432
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=${DISPATCH_DB_PASS}
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASS}
    ports:
      - "8082:8082"

  ai-db:
    image: postgres:18-alpine
    volumes:
      - ai-db-data:/var/lib/postgresql
    ports:
      - "5434:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d ai_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      - POSTGRES_DB=ai_db
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=${AI_DB_PASS}

  ai-service:
    build: ./ai-service
    ports:
      - "8083:8083"
    depends_on:
      - ai-db
    environment: # PROD: Inject cleanly here
      - SPRING_DATASOURCE_URL=jdbc:postgresql://ai-db:5432/ai_db # Standard internal port 5432
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=${AI_DB_PASS}
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASS}
  notification-service:
    build: ./notification-service
    ports:
      - "8084:8084"
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASS}

volumes:
    incident-db-data:
    dispatch-db-data:
    ai-db-data: