services:

  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    environment:
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8180
      KC_HOSTNAME_STRICT_BACKCHANNEL: "true"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${DOCKER_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_LOG_LEVEL: info
    ports:
        - "8180:8080" # keeping this accessible even in prod for clients
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8180/health/ready" ]
      interval: 15s
      timeout: 2s
      retries: 15
    command:
      - start-dev
    volumes:
      - keycloak-data:/opt/keycloak/data
    networks:
      - identity
  rabbitmq:
    image: rabbitmq:3-management
    container_name: codered-rabbitmq
    ports:
      - "5671:5671" # AMQP over TLS
      - "15672:15672" #should be restricted only to admins in system prod(not any type of users even agents)
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./pki/ca/ca.crt:/certs/ca.crt:ro
      - ./pki/rabbitmq/rabbitmq.crt:/certs/rabbitmq.crt:ro
      - ./pki/rabbitmq/rabbitmq.key:/certs/rabbitmq.key:ro
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - broker

  api-gateway:
    build: ./api-gateway
    ports:
      - "8000:8000" #should always be accessible from outside in prod
    volumes:
      - ./pki/gateway/gateway-keystore.p12:/certs/gateway-keystore.p12:ro
      - ./pki/ca/codered-truststore.p12:/certs/codered-truststore.p12:ro
    depends_on:
      - dispatch-service
      - ai-service
      - incident-service
      - notification-service
    networks:
      - edge
      - identity
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - GATEWAY_TLS_KEYSTORE_PASSWORD=${GATEWAY_TLS_KEYSTORE_PASSWORD}
      - INCIDENT_TLS_TRUSTSTORE_PASSWORD=${INCIDENT_TLS_TRUSTSTORE_PASSWORD}


  incident-db:
    image: postgres:18-alpine
    volumes:
      - incident-db-data:/var/lib/postgresql
    ports:
        - "5435:5432"  #should not be accessible from outside in prod
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d incident_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      - POSTGRES_DB=incident_db
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=${INCIDENT_DB_PASS}
    networks:
      - incident-db-net

  incident-service:
    build:
      context: .
      dockerfile: incident-service/Dockerfile
    ports:
      - "8081:8081" #should not be accessible from outside in prod, this line should be removed in prod
    expose:
      - "8081" #should not be accessible from outside in prod
    depends_on:
      - incident-db
    volumes:
      - ./pki/incident-service/incident-service-keystore.p12:/certs/incident-service-keystore.p12:ro
      - ./pki/ca/codered-truststore.p12:/certs/codered-truststore.p12:ro
    environment: # PROD: Inject cleanly here
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=${INCIDENT_DB_PASS}
      - SPRING_FLYWAY_USERNAME=admin
      - SPRING_FLYWAY_PASSWORD=${INCIDENT_DB_PASS}
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_INCIDENT_SERVICE_USERNAME}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_INCIDENT_SERVICE_PASSWORD}
      - MODEL_VERSION=${MODEL_VERSION}
      - INCIDENT_TLS_KEYSTORE_PASSWORD=${INCIDENT_TLS_KEYSTORE_PASSWORD}
      - INCIDENT_TLS_TRUSTSTORE_PASSWORD=${INCIDENT_TLS_TRUSTSTORE_PASSWORD}
    networks:
      - edge
      - broker
      - incident-db-net
      - identity
  dispatch-db:
    image: postgres:18-alpine
    volumes:
      - dispatch-db-data:/var/lib/postgresql
    ports:
      - "5433:5432"  #should not be accessible from outside in prod
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d dispatch_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      - POSTGRES_DB=dispatch_db
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=${DISPATCH_DB_PASS}
    networks:
      - dispatch-db-net



  dispatch-service:
    build: ./dispatch-service
    depends_on:
      - dispatch-db
    environment: # PROD: Inject cleanly here
      - SPRING_DATASOURCE_URL=jdbc:postgresql://dispatch-db:5432/dispatch_db # Standard internal port 5432
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=${DISPATCH_DB_PASS}
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASS}
    ports:
      - "8082:8082" #should not be accessible from outside in prod
    networks:
      - edge
      - broker
      - dispatch-db-net

  ai-db:
    image: postgres:18-alpine
    volumes:
      - ai-db-data:/var/lib/postgresql
    ports:
      - "5434:5432" #should not be accessible from outside in prod
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d ai_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      - POSTGRES_DB=ai_db
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=${AI_DB_PASS}
    networks:
      - ai-db-net

  ai-service:
    build:
        context: .
        dockerfile: ai-service/Dockerfile
    expose:
      - "8083" #should not be accessible from outside in prod
    depends_on:
      - ai-db
    volumes:
      - ./pki/ca/codered-truststore.p12:/certs/codered-truststore.p12:ro
    environment: # PROD: Inject cleanly here
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=${AI_DB_PASS}
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_AI_SERVICE_USERNAME}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_AI_SERVICE_PASSWORD}
      - INCIDENT_TLS_TRUSTSTORE_PASSWORD=${INCIDENT_TLS_TRUSTSTORE_PASSWORD}
      - SPRING_FLYWAY_USERNAME=admin
      - SPRING_FLYWAY_PASSWORD=${AI_DB_PASS}
      - MODEL_VERSION=${MODEL_VERSION}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_BASE_URL=${GROQ_BASE_URL}
      - GROQ_MODEL=${GROQ_MODEL}
    networks:
      - broker
      - ai-db-net
  notification-service:
    build: ./notification-service
    ports:
      - "8084:8084"
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASS}
    networks:
      - edge
      - broker

volumes:
    incident-db-data:
    dispatch-db-data:
    ai-db-data:
    keycloak-data:
    rabbitmq-data:


networks:
  edge:
    driver: bridge
  broker:
    driver: bridge
  incident-db-net:
    driver: bridge
  dispatch-db-net:
    driver: bridge
  ai-db-net:
    driver: bridge
  identity:
    driver: bridge
